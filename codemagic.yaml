# CodeMagic workflow for SE7A iOS builds — manual signing.
#
# Setup (one-time, in CodeMagic UI):
#   1. Team settings → Code signing identities:
#        - iOS Certificates → upload se7a_dist.p12 (with its password)
#          and name the reference `se7a_distribution_cert`.
#        - Provisioning profiles → upload the .mobileprovision file
#          from Apple Developer and name the reference
#          `se7a_app_store_profile`.
#   2. Push to main. The yaml references those two names below.
#
# No App Store Connect integration or ASC env vars needed with this
# approach. The .p12 and .mobileprovision are the complete signing
# material; Codemagic installs them and tells Xcode which to use.

workflows:
  ios-production:
    name: SE7A iOS (production)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        provisioning_profiles:
          - se7a_app_store_profile
        certificates:
          - se7a_distribution_cert
      node: 20.11.0
      # Apple requires iOS 26 SDK (Xcode 26+) for App Store uploads
      # as of Oct 2026. `latest` picks whatever Codemagic has most
      # recent on their build image — switch to a pinned version
      # like `26.0` if a specific one is needed.
      xcode: latest
      cocoapods: default
      # Env var group `se7a_env` holds the EXPO_PUBLIC_* vars that
      # Expo bakes into the JS bundle at build time (Supabase URL +
      # anon key, RevenueCat iOS key, Sentry DSN, PostHog key…).
      # Without these, createClient() throws "supabaseUrl is required"
      # on first launch and the app crashes before rendering.
      groups:
        - se7a_env
      vars:
        # Sentry's "Upload Debug Symbols to Sentry" build phase (from
        # the @sentry/react-native/expo plugin) fails the archive when
        # no SENTRY_AUTH_TOKEN is present. Skip the upload here; same
        # policy used for EAS production builds.
        SENTRY_DISABLE_AUTO_UPLOAD: "true"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm
        - apps/mobile/node_modules
    scripts:
      - name: Install JS deps
        script: |
          cd apps/mobile
          npm ci --legacy-peer-deps
      - name: Expo prebuild (generate native iOS project)
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Apply signing profiles to Xcode project
        # Default --project glob is '**/*.xcodeproj' which recurses
        # into node_modules and tries to re-sign every nested library
        # (RNDateTimePicker, etc). Those don't need the app's
        # distribution profile — scope to the main app project only.
        script: |
          cd apps/mobile
          xcode-project use-profiles --project ios/SE7A.xcodeproj
      - name: Set build number
        script: |
          cd apps/mobile/ios
          agvtool new-version -all "$(($(date +%s) % 10000))"
      - name: Build .ipa
        script: |
          cd apps/mobile
          xcode-project build-ipa \
            --workspace ios/SE7A.xcworkspace \
            --scheme SE7A
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      # dSYM paths — needed to symbolicate crashes. Codemagic's
      # build-ipa drops them next to the archive and in DerivedData.
      - apps/mobile/build/ios/**/*.dSYM
      - apps/mobile/build/ios/xcarchive/dSYMs/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive
    publishing:
      email:
        recipients:
          - basem.aboulhosn@gmail.com
        notify:
          success: true
          failure: true
