# CodeMagic workflow for SE7A iOS builds — fallback for when EAS
# free-tier builds are exhausted. Produces an App Store-signed
# .ipa and emails it to the configured address.
#
# Setup (one-time, in the CodeMagic web UI):
#   1. Team settings → Integrations → App Store Connect → Add new.
#      Name it exactly "se7a_asc_key". Paste your App Store Connect
#      API key: Issuer ID + Key ID + the .p8 file. Save.
#   2. Open this app in CodeMagic → the workflow should now show
#      "App Store Connect: se7a_asc_key" linked.
#   3. Trigger a build. CodeMagic auto-handles cert + profile via
#      the integration — no CERTIFICATE_PRIVATE_KEY or manual
#      fetch-signing-files script needed. The 4 env vars from the
#      earlier manual approach can be deleted; this is cleaner.

workflows:
  ios-production:
    name: SE7A iOS (production)
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Links this workflow to the App Store Connect integration
    # configured in CodeMagic UI. Named "se7a_asc_key" — must match
    # the integration name in step 1 above.
    integrations:
      app_store_connect: se7a_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.se7a.mobile
      node: 20.11.0
      xcode: 16.0
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm
        - apps/mobile/node_modules
    scripts:
      - name: Install JS deps
        script: |
          cd apps/mobile
          npm ci --legacy-peer-deps
      - name: Expo prebuild (generate native iOS project)
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Apply signing profiles to Xcode project
        # Codemagic's auto-signing (triggered by integrations +
        # ios_signing above) has already fetched/created the cert
        # and provisioning profile by this point. This step wires
        # them into the Xcode project files.
        script: |
          cd apps/mobile
          xcode-project use-profiles
      - name: Set build number from Codemagic BUILD_NUMBER
        script: |
          cd apps/mobile/ios
          agvtool new-version -all "$(($(date +%s) % 10000))"
      - name: Build .ipa
        script: |
          cd apps/mobile
          xcode-project build-ipa \
            --workspace ios/SE7A.xcworkspace \
            --scheme SE7A
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - basem.aboulhosn@gmail.com
        notify:
          success: true
          failure: true
