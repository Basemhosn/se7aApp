# CodeMagic workflow for SE7A iOS builds — manual signing.
#
# Setup (one-time, in CodeMagic UI):
#   1. Team settings → Code signing identities:
#        - iOS Certificates → upload se7a_dist.p12 (with its password)
#          and name the reference `se7a_distribution_cert`.
#        - Provisioning profiles → upload the .mobileprovision file
#          from Apple Developer and name the reference
#          `se7a_app_store_profile`.
#   2. Push to main. The yaml references those two names below.
#
# No App Store Connect integration or ASC env vars needed with this
# approach. The .p12 and .mobileprovision are the complete signing
# material; Codemagic installs them and tells Xcode which to use.

workflows:
  ios-production:
    name: SE7A iOS (production)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        provisioning_profiles:
          - se7a_app_store_profile
        certificates:
          - se7a_distribution_cert
      node: 20.11.0
      xcode: 16.0
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm
        - apps/mobile/node_modules
    scripts:
      - name: Install JS deps
        script: |
          cd apps/mobile
          npm ci --legacy-peer-deps
      - name: Expo prebuild (generate native iOS project)
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Apply signing profiles to Xcode project
        script: |
          cd apps/mobile
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd apps/mobile/ios
          agvtool new-version -all "$(($(date +%s) % 10000))"
      - name: Build .ipa
        script: |
          cd apps/mobile
          xcode-project build-ipa \
            --workspace ios/SE7A.xcworkspace \
            --scheme SE7A
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - basem.aboulhosn@gmail.com
        notify:
          success: true
          failure: true
